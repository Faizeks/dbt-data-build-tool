version: 2

models:
  - name: stg_rentals
    description: "Staging model untuk transaksi rental."
    columns:
      - name: rental_id
        description: "Unique identifier untuk rental."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Identifier customer yang melakukan rental."
        data_tests:
          - not_null

      - name: inventory_id
        description: "Identifier inventory yang dirental."
        data_tests:
          - not_null

      - name: staff_id
        description: "Identifier staff yang menangani rental."

      - name: rented_at
        description: "Waktu rental dilakukan."
        data_tests:
          - not_null

      - name: returned_at
        description: "Waktu item dikembalikan."