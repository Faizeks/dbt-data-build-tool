version: 2

models:
  - name: dim_customers
    description: "Dimension customer dengan ringkasan aktivitas rental dan payment."
    columns:
      - name: customer_id
        description: "Unique identifier customer."
        data_tests:
          - not_null
          - unique

      - name: customer_name
        description: "Nama lengkap customer."
        data_tests:
          - not_null

      - name: total_rentals
        description: "Total rental yang dilakukan customer."

      - name: first_rented_at
        description: "Waktu rental pertama customer."

      - name: last_rented_at
        description: "Waktu rental terakhir customer."

      - name: lifetime_payment_total
        description: "Total seluruh pembayaran customer."